# Wrangler 配置文件
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "ziqiong"

# 兼容性日期 - 锁定 Cloudflare Workers 运行时版本
compatibility_date = "2026-02-10"

# Pages 构建输出目录（部署时需要）
# 注意：运行 npm run dev 时需注释此行，否则与 --proxy 冲突
pages_build_output_dir = "dist"

# R2 存储桶绑定
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "duan"
preview_bucket_name = "duan"

# 环境变量（本地开发）
# 注意：生产环境需要在 Cloudflare Dashboard → Pages → Settings → Environment variables 中配置
[vars]
UPLOAD_PASSWORD = "change-this-password"
